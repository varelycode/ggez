name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - name: Run tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Require release version bump
        env:
          GGEZ_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GGEZ_HEAD_SHA: ${{ github.sha }}
        run: python3 -B scripts/check_version.py
